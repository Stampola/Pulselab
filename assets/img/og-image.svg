<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="15%" r="80%">
      <stop offset="0" stop-color="#0A1530"/>
      <stop offset="0.55" stop-color="#070B1F"/>
      <stop offset="1" stop-color="#040611"/>
    </radialGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DA9FF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(61,169,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="200" cy="120" r="280" fill="#00E5FF" opacity="0.10" filter="url(#softglow)"/>
  <circle cx="1050" cy="500" r="240" fill="#8B5CF6" opacity="0.14" filter="url(#softglow)"/>

  <g transform="translate(96,96)">
    <rect width="80" height="80" rx="16" fill="#0A1530" stroke="url(#ac)" stroke-width="1.5"/>
    <path d="M14 40 L22 40 L30 22 L40 58 L50 30 L58 50 L66 40 L70 40"
          stroke="url(#ac)" stroke-width="4.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="104" y="58" font-family="Inter, -apple-system, sans-serif"
          font-size="40" font-weight="500" fill="#E4ECFF" letter-spacing="-1">Pulselab</text>
  </g>

  <text x="96" y="320" font-family="Inter, -apple-system, sans-serif"
        font-size="84" font-weight="500" fill="#E4ECFF" letter-spacing="-2">Websites that</text>
  <text x="96" y="420" font-family="Inter, -apple-system, sans-serif" font-size="84" font-weight="500" letter-spacing="-2">
    <tspan fill="url(#ac)" filter="url(#glow)">look beautiful</tspan><tspan fill="#E4ECFF">, rank top,</tspan>
  </text>
  <text x="96" y="520" font-family="Inter, -apple-system, sans-serif" font-size="84" font-weight="500" letter-spacing="-2">
    <tspan fill="#E4ECFF">and </tspan><tspan fill="url(#ac)" filter="url(#glow)">sell more</tspan><tspan fill="#E4ECFF">.</tspan>
  </text>

  <text x="96" y="580" font-family="Inter, -apple-system, sans-serif"
        font-size="24" fill="#8B98B8">Web design + SEO studio · pulselab.work</text>
</svg>
